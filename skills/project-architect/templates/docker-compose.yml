version: '3.8'

services:
  orchestrator:
    build: .
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
